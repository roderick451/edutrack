databases:
  - name: edutrack-db
    databaseName: edutrack
    user: edutrack
    plan: free

services:
  - type: web
    name: edutrack
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edutrack-db
          property: connectionString
